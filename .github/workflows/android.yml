name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # A stable key lets a new APK install over the previous one. Without it every
      # runner would generate its own debug key and Android would refuse the update.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_B64" || { echo "DEBUG_KEYSTORE_B64 secret is missing"; exit 1; }
          mkdir -p "$HOME/.android"
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Bump appVersionName in gradle.properties to publish a new version;
      # pushes without a bump refresh the APK of the current release.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep '^appVersionName=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          tag="v$version"
          apk=app/build/outputs/apk/release/app-release.apk
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "Тайный Санта $version" --target "$GITHUB_SHA" \
              --notes "Скачайте app-release.apk и установите на Android 8.0 или новее."
          fi
